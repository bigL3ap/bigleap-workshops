<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Results Wall</title>
<meta name="description" content="Live results from the Curran RevOps workshop, for the projector.">
<link rel="icon" href="../assets/bigleap-logo.png">
<link rel="stylesheet" href="../assets/workshop.css">
<style>
  body { background:#F4F7FA; }
  .bar { background:#fff; border-bottom:2px solid var(--blue); display:flex; align-items:center; gap:14px; padding:10px 20px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .bar img { height:26px; }
  .back { display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:6px 14px; border:1.5px solid var(--line); border-radius:10px; font:700 14px "Open Sans",Arial,sans-serif; color:var(--navy); text-decoration:none; background:#fff; white-space:nowrap; }
  .back:hover { background:var(--sky); }
  @media (max-width:820px){ .back { min-height:44px; } }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button { min-height:40px; border:0; background:transparent; border-radius:10px; padding:6px 12px; font:700 14px "Open Sans",Arial,sans-serif; color:var(--muted); cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--navy); color:#fff; }
  .ctl { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .ctl select, .ctl button { min-height:36px; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:4px 10px; font:600 13px "Open Sans",Arial,sans-serif; color:var(--navy); cursor:pointer; }
  .live-dot { width:9px; height:9px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; box-shadow:0 0 0 0 rgba(30,138,90,.5); animation:pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(30,138,90,0); } 100% { box-shadow:0 0 0 0 rgba(30,138,90,0); } }
  .stage-wrap { padding:22px 28px 28px; max-width:1800px; margin:0 auto; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .head h1 { font-size:clamp(28px,2.6vw,46px); font-weight:800; }
  .head .sub { color:var(--muted); font-size:clamp(14px,1.05vw,19px); margin-top:4px; }
  .join { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 12px; }
  .join img { width:84px; height:84px; image-rendering:pixelated; }
  .join b { font:800 15px "Raleway",Arial,sans-serif; display:block; } .join span { font-size:12px; color:var(--muted); }
  .big { font:800 clamp(40px,4vw,72px)/1 "Raleway",Arial,sans-serif; color:var(--navy); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
  .grid2 { display:grid; grid-template-columns:1.5fr 1fr; gap:20px; margin-top:20px; }
  @media (max-width:1000px){ .grid2 { grid-template-columns:1fr; } }
  .empty { text-align:center; color:var(--faint); padding:60px 20px; font-size:20px; }
  .demo-flag { background:var(--amber-soft); color:var(--amber); font-weight:700; padding:4px 10px; border-radius:999px; font-size:12px; }
  .k { font:700 12px "Open Sans",Arial,sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--blue); }
  /* Pulse */
  .cloud { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 22px; min-height:320px; padding:20px; }
  .cloud span { font-family:"Raleway",Arial,sans-serif; font-weight:800; line-height:1; cursor:pointer; font-size:var(--fs); }
  /* Phones: scale the whole cloud down rather than clamping, so the biggest word stays the biggest,
     and never break a word across lines. */
  @media (max-width:820px){
    .cloud { min-height:150px; gap:7px 14px; padding:14px 10px; }
    .cloud span { font-size:calc(13px + (var(--fs) - 22px) * 0.30); overflow-wrap:normal; word-break:keep-all; hyphens:none; }
  }
  @media (max-width:430px){
    .cloud span { font-size:calc(12px + (var(--fs) - 22px) * 0.24); }
  }
  @media (max-width:820px){
    /* The join QR is for the projector; whoever is reading this on a phone is already here. */
    .head .join { display:none; }
    .head .k { white-space:nowrap; }
    .head { gap:12px; }
    .head .big { font-size:34px; }
  }
  .dist { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-items:end; height:220px; margin-top:44px; }
  .dist div { background:var(--blue); border-radius:10px 10px 4px 4px; position:relative; min-height:4px; }
  .dist div b { position:absolute; top:-26px; left:0; right:0; text-align:center; font-weight:800; color:var(--navy); }
  .dist-l { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; text-align:center; font-weight:700; color:var(--muted); margin-top:6px; }
  /* Heatmap */
  .heat { display:grid; grid-template-columns:150px repeat(8,1fr); gap:6px; margin-top:12px; }
  .heatwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .swipe { display:none; }
  @media (max-width:820px){
    .heat { min-width:660px; grid-template-columns:104px repeat(8,minmax(62px,1fr)); gap:5px; }
    .heat .h { font-size:12px; padding:4px 2px; }
    .heat .rl { font-size:13px; }
    .heat .c { min-height:52px; font-size:18px; }
    .swipe { display:block; margin:8px 0 0; font:600 13px "Open Sans",Arial,sans-serif; color:var(--muted); }
  }
  .heat .h { font:800 clamp(12px,.9vw,15px)/1.2 "Raleway",Arial,sans-serif; color:var(--navy); text-align:center; padding:6px 2px; }
  .heat .rl { font:700 14px "Open Sans",Arial,sans-serif; display:flex; align-items:center; color:var(--navy); }
  .heat .c { min-height:clamp(58px,6vh,88px); border-radius:10px; display:grid; place-items:center; font:800 clamp(18px,1.6vw,28px) "Raleway",Arial,sans-serif; cursor:pointer; border:0; }
  .heat .c[aria-pressed="true"] { outline:3px solid var(--navy); outline-offset:2px; }
  .heat .tot { font:700 14px "Open Sans",Arial,sans-serif; text-align:center; color:var(--muted); }
  .items { display:grid; gap:10px; margin-top:12px; max-height:62vh; overflow:auto; padding-right:4px; }
  .item { background:var(--sky); border-radius:12px; padding:12px 32px 12px 14px; font-size:clamp(14px,1vw,18px); position:relative; }
  .item .x { position:absolute; right:4px; top:4px; width:30px; height:30px; border:0; background:transparent; color:var(--faint); cursor:pointer; font-size:18px; line-height:1; }
  .item .meta { margin-bottom:4px; }
  .callout { background:var(--navy); color:#fff; border-radius:16px; padding:16px 18px; }
  .callout .k { color:#8CC6E6; }
  .callout b { font:800 clamp(20px,1.6vw,28px) "Raleway",Arial,sans-serif; display:block; margin-top:4px; }
  /* Fix-its */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; margin-top:20px; }
  .rc { background:var(--navy); color:#fff; border-radius:18px; padding:18px; position:relative; }
  .rc h3 { color:#fff; font-size:clamp(17px,1.2vw,21px); }
  .rc .ln { display:grid; grid-template-columns:76px 1fr; gap:8px; border-top:1px solid rgba(255,255,255,.14); padding:8px 0; font-size:14.5px; }
  .rc .ln span:first-child { font:700 11px "Open Sans",Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#8CC6E6; padding-top:2px; }
  .rc .tagp { display:inline-block; background:#8CC6E6; color:var(--navy); font-weight:700; font-size:12px; border-radius:999px; padding:2px 9px; margin:6px 4px 0 0; }
  .rc .x { position:absolute; right:10px; top:8px; border:0; background:transparent; color:#7FA0B4; cursor:pointer; font-size:18px; }
  /* Proposals */
  .pcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:18px; margin-top:20px; }
  .pc { background:var(--navy); color:#fff; border-radius:18px; padding:20px; position:relative; }
  .pc.win { box-shadow:0 0 0 4px var(--red); }
  .pc h3 { color:#fff; font-size:clamp(19px,1.4vw,24px); margin-top:6px; }
  .pc .g { font:700 12px "Open Sans",Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#8CC6E6; }
  .pc .sec { border-top:1px solid rgba(255,255,255,.14); padding:8px 0; margin-top:8px; font-size:15px; }
  .pc .sec .g { display:block; margin-bottom:2px; }
  .pc ul { margin:2px 0 0; padding-left:18px; }
  .pc .votes { position:absolute; right:16px; top:14px; text-align:right; }
  .pc .votes b { font:800 34px/1 "Raleway",Arial,sans-serif; display:block; }
  .pc .votes span { font-size:11px; color:#8CC6E6; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .pc .x { position:absolute; right:10px; bottom:8px; border:0; background:transparent; color:#7FA0B4; cursor:pointer; font-size:18px; }
  @media (max-width:820px){ .pcards { grid-template-columns:1fr; } }
  /* Robot */
  .rows { display:grid; gap:9px; margin-top:12px; }
  .rrow { display:grid; grid-template-columns:minmax(220px,1.1fr) 2fr; gap:14px; align-items:center; font-size:clamp(13px,.95vw,16px); }
  .stack { display:flex; height:30px; border-radius:8px; overflow:hidden; background:#E4EBF0; }
  .stack i { display:block; height:100%; font-style:normal; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; }
  .lg { display:flex; gap:16px; font-size:13px; color:var(--muted); margin-top:8px; } .lg i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  @media (max-width:820px){
    .rrow { grid-template-columns:1fr; gap:5px; align-items:stretch; }
    .rows { gap:14px; }
    .stack { height:26px; }
    .cards { grid-template-columns:1fr; }
    .rc .ln { grid-template-columns:68px 1fr; }
  }
  /* Moves */
  .mv { display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; margin-top:14px; }
  .mv .t { font:700 clamp(15px,1.1vw,19px) "Open Sans",Arial,sans-serif; color:var(--navy); }
  .mv .bt { grid-column:1 / -1; height:22px; background:#E4EBF0; border-radius:8px; overflow:hidden; }
  .mv .bt i { display:block; height:100%; background:var(--red); border-radius:8px; }
  .mv .n { font:800 22px "Raleway",Arial,sans-serif; }
  .mv .w { font-size:12px; color:var(--blue); font-weight:700; }
  .qcols { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
  @media (max-width:1100px){ .qcols { grid-template-columns:1fr; } }
  /* Phones and small laptops: compact header, projector-only controls hidden */
  @media (max-width:820px){
    .bar.bar { gap:10px; padding:8px 14px; flex-wrap:nowrap; }
    .bar.bar > img { height:22px; flex:none; }
    .bar .tabs { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; flex:1 1 auto; min-width:0; }
    .bar .tabs::-webkit-scrollbar { display:none; }
    .bar .tabs button { white-space:nowrap; min-height:44px; }
    .bar .ctl { display:none; }
  }
  .hidden-text .item .txt, .hidden-text .rc .ln, .hidden-text .cloud span { filter:blur(9px); }
</style>
</head>
<body>
<div class="bar">
  <img src="../assets/bigleap-logo.png" alt="Big Leap">
  <a class="back" href="index.html"><span aria-hidden="true">&#8592;</span> Toolkits</a>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="pulse">Group Think</button>
    <button role="tab" data-v="friction">Friction</button>
    <button role="tab" data-v="proposals">Proposals &amp; votes</button>
  </div>
  <div class="ctl">
    <span id="status"><span class="live-dot"></span>Live</span>
    <label class="sr" for="grp">Filter by group</label>
    <select id="grp"><option value="">All groups</option></select>
    <button id="reveal" type="button" aria-pressed="true">Hide answers</button>
    <button id="full" type="button">Full screen</button>
  </div>
</div>
<main class="stage-wrap" id="view" aria-live="polite"></main>
<script src="../assets/config.js"></script>
<script src="../assets/workshop.js"></script>
<script src="../assets/demo.js"></script>
<script>
  var C = BL.config, view = BL.params.get('view') || 'pulse', grp = '', hiddenKey = 'bl_ws_' + C.session + '_wallhidden';
  var hidden = (function () { try { return JSON.parse(localStorage.getItem(hiddenKey) || '[]'); } catch (e) { return []; } })();
  var HUB = C.publicUrl || location.href.replace(/wall\.html.*$/, '');
  var tabs = document.querySelectorAll('#tabs button');
  function setTab(v) { view = v; tabs.forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-v') === v ? 'true' : 'false'); }); var u = new URL(location.href); u.searchParams.set('view', v); history.replaceState(null, '', u); load(); }
  tabs.forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-v')); }); });
  C.groups.forEach(function (g) { var o = document.createElement('option'); o.value = g.id; o.textContent = g.name + ' · ' + g.lead; document.getElementById('grp').appendChild(o); });
  document.getElementById('grp').addEventListener('change', function (e) { grp = e.target.value; load(); });
  var rv = document.getElementById('reveal');
  rv.addEventListener('click', function () { var on = document.body.classList.toggle('hidden-text'); rv.textContent = on ? 'Reveal answers' : 'Hide answers'; });
  document.getElementById('full').addEventListener('click', function () { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });
  var demo = BL.params.get('demo') === '1';
  document.getElementById('status').innerHTML = demo ? '<span class="demo-flag">Sample data</span>' : (BL.live ? '<span class="live-dot"></span>Live' : '<span class="demo-flag">Demo mode: this device only</span>');

  function key(r) { return r.cid + '|' + r.ts; }
  function hide(k) { hidden.push(k); try { localStorage.setItem(hiddenKey, JSON.stringify(hidden)); } catch (e) {} load(); }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-hide]'); if (b) hide(b.getAttribute('data-hide')); });
  var E = BL.esc, V = document.getElementById('view');
  function joinBox() { return '<div class="join"><img src="../assets/qr-hub.png" alt="QR code to join"><div><b>Join from your phone</b><span>' + E(HUB.replace(/^https?:\/\//, '')) + '</span></div></div>'; }
  function header(eyebrow, title, sub, n) { return '<div class="head"><div><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1><p class="sub">' + sub + '</p></div><div style="display:flex;gap:18px;align-items:center"><div style="text-align:right"><div class="big">' + n + '</div><div class="k">responses</div></div>' + joinBox() + '</div></div>'; }
  function stageName(id) { var s = BL.STAGES.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
  var HX = { data:[49,135,181], process:[123,94,167], comm:[217,130,43] };

  var R = {
    pulse: function (rows) {
      var words = {}, dist = [0, 0, 0, 0, 0], sum = 0;
      rows.forEach(function (r) { var w = (r.payload.word || '').toLowerCase(); if (w) (words[w] = words[w] || { n: 0, k: key(r) }).n++; if (r.payload.score) { dist[r.payload.score - 1]++; sum += r.payload.score; } });
      var list = Object.keys(words).map(function (w) { return { w: w, n: words[w].n, k: words[w].k }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 60);
      var max = list.length ? list[0].n : 1, cols = ['#143D55', '#3187B5', '#EA4335', '#4D6575', '#1F6A92'];
      var cloud = list.map(function (x, i) { var s = 22 + Math.round(70 * Math.sqrt(x.n / max)); return '<span style="--fs:' + s + 'px;color:' + cols[i % cols.length] + '" data-hide="' + E(x.k) + '" title="Click to hide">' + E(x.w) + '</span>'; }).join('');
      var dmax = Math.max.apply(null, dist.concat([1]));
      var avg = rows.length ? (sum / rows.length).toFixed(1) : '–';
      return header('Group Think', 'How does it feel to work in our systems today?', 'One word each. Bigger means more people said it.', rows.length) +
        '<div class="grid2"><section class="panel"><div class="cloud">' + (cloud || '<div class="empty">Waiting for the first word…</div>') + '</div></section>' +
        '<section class="panel"><div class="k">Team efficiency: not efficient at all (1) → most efficient (5)</div><div style="display:flex;align-items:baseline;gap:10px;margin-top:8px"><span class="big">' + avg + '</span><span class="sub">room average</span></div>' +
        '<div class="dist">' + dist.map(function (d) { return '<div style="height:' + Math.round(100 * d / dmax) + '%"><b>' + d + '</b></div>'; }).join('') + '</div><div class="dist-l"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></section></div>';
    },
    friction: function (rows, sel) {
      var cell = {}, stageTot = {}, max = 1, teams = {};
      function bk(p) { return p.buckets && p.buckets.length ? p.buckets : [p.bucket]; }
      rows.forEach(function (r) { var p = r.payload; bk(p).forEach(function (bb) { var k = p.stage + '|' + bb; cell[k] = (cell[k] || 0) + 1; max = Math.max(max, cell[k]); }); stageTot[p.stage] = (stageTot[p.stage] || 0) + 1; if (r.team) { (teams[p.stage] = teams[p.stage] || {})[r.team] = 1; } });
      var top = Object.keys(stageTot).sort(function (a, b) { return stageTot[b] - stageTot[a]; })[0];
      var shared = Object.keys(teams).filter(function (s) { return Object.keys(teams[s]).length >= 3; }).map(stageName);
      var g = '<div class="heatwrap"><div class="heat"><div></div>' + BL.STAGES.map(function (s) { return '<div class="h">' + s.n + '. ' + s.name + '</div>'; }).join('');
      BL.BUCKETS.forEach(function (b) {
        g += '<div class="rl"><span class="pill ' + b.id + '" style="font-size:13px">' + b.name.replace(' problem', '') + '</span></div>';
        BL.STAGES.forEach(function (s) {
          var n = cell[s.id + '|' + b.id] || 0, a = n ? .15 + .85 * n / max : 0, c = HX[b.id];
          g += '<button class="c" data-cell="' + s.id + '|' + b.id + '" aria-pressed="' + (sel === s.id + '|' + b.id) + '" style="background:' + (n ? 'rgba(' + c.join(',') + ',' + a.toFixed(2) + ')' : '#EEF2F5') + ';color:' + (a > .55 ? '#fff' : 'var(--navy)') + '">' + (n || '') + '</button>';
        });
      });
      g += '<div></div>' + BL.STAGES.map(function (s) { return '<div class="tot">' + (stageTot[s.id] || 0) + '</div>'; }).join('') + '</div></div><p class="swipe">Swipe the grid sideways to see every stage.</p>';
      var list = rows.filter(function (r) { return !sel || bk(r.payload).some(function (bb) { return (r.payload.stage + '|' + bb) === sel; }); }).sort(function (a, b) { return (b.payload.hurt || 0) - (a.payload.hurt || 0); });
      var hurtL = ['', 'Annoying', 'Costs time', 'Costs deals'];
      var items = list.map(function (r) { var p = r.payload; return '<div class="item"><button class="x" data-hide="' + E(key(r)) + '" title="Hide from wall" aria-label="Hide">×</button><div class="meta"><span class="pill">' + stageName(p.stage) + '</span>' + bk(p).map(function (bb) { var m = BL.BUCKETS.filter(function (x) { return x.id === bb; })[0]; return '<span class="pill ' + bb + '">' + (m ? m.name.replace(' problem', '') : bb) + '</span>'; }).join('') + (r.team ? '<span class="pill">' + E(r.team) + '</span>' : '') + (p.hurts && p.hurts.length ? p.hurts : [p.hurt || 1]).map(function (h) { return '<span class="pill">' + hurtL[h] + '</span>'; }).join('') + '</div><div class="txt">' + E(p.text) + '</div></div>'; }).join('');
      return header('Breakout · Step 1', 'Where does revenue get stuck?', 'Darker means more people flagged it. Click a square to see what’s behind it.', rows.length) +
        '<section class="panel" style="margin-top:20px">' + g + '</section>' +
        '<div class="grid2"><section class="panel"><div class="k">' + (sel ? stageName(sel.split('|')[0]) + ' · ' + sel.split('|')[1] + ' <button class="linkbtn" data-clear="1">show all</button>' : 'Everything flagged, worst first') + '</div><div class="items">' + (items || '<div class="empty">Nothing here yet</div>') + '</div></section>' +
        '<section style="display:grid;gap:16px;align-content:start">' + (top ? '<div class="callout"><div class="k">Most friction</div><b>' + stageName(top) + '</b></div>' : '') +
        (shared.length ? '<div class="callout" style="background:#7B5EA7"><div class="k" style="color:#E6DCF5">Same problem, different seats</div><b>' + shared.join(', ') + '</b><p style="margin-top:6px;color:#EFE8F8">Three or more teams flagged this stage. That’s usually one RevOps problem showing up in different ways.</p></div>' : '') +
        '<div class="panel"><div class="k">Prompt for the room</div><p style="margin-top:6px;font-size:18px">Pick the 3–5 squares we’ll solve together in the next section.</p></div></section></div>';
    },
    fixit: function (rows) {
      var ph = function (id) { return BL.ROADMAP.filter(function (p) { return p.id === id; })[0]; };
      var cards = rows.slice().reverse().map(function (r) { var p = r.payload; return '<article class="rc"><button class="x" data-hide="' + E(key(r)) + '" aria-label="Hide">×</button><h3>' + E(p.problem) + '</h3><div style="margin-top:10px"><div class="ln"><span>When</span><span>' + E(p.trigText) + '</span></div><div class="ln"><span>System</span><span>' + (p.actText || []).map(E).join('<br>') + '</span></div><div class="ln"><span>Person</span><span>' + E(p.owner) + (p.human ? ': ' + E(p.human) : '') + '</span></div><div class="ln"><span>Measure</span><span>' + E(p.measText) + '</span></div></div>' + (p.phases || []).map(function (id) { var x = ph(id); return x ? '<span class="tagp">' + E(x.when) + ' · ' + E(x.name) + '</span>' : ''; }).join('') + '</article>'; }).join('');
      return header('What could HubSpot do about it?', 'The room’s fix-it recipes', 'Each recipe is tagged with where it already sits in the plan.', rows.length) + '<div class="cards">' + (cards || '<div class="empty">No recipes yet</div>') + '</div>';
    },
    proposals: function (rows, sel, votes) {
      var props = rows.filter(function (r) { return r.payload.kind === 'proposal'; });
      var latest = {}; props.forEach(function (r) { latest[r.group + '|' + r.cid] = r; });
      props = Object.keys(latest).map(function (k) { return latest[k]; });
      var vc = {}; (votes || []).forEach(function (r) { if (r.payload.kind === 'vote') vc[r.payload.target] = (vc[r.payload.target] || 0) + 1; });
      props.sort(function (a, b) { return (vc[key(b)] || 0) - (vc[key(a)] || 0); });
      var top = props.length && vc[key(props[0])] ? key(props[0]) : '';
      var nv = Object.keys(vc).reduce(function (a, k) { return a + vc[k]; }, 0);
      var fmt = function (m) { return !m ? '' : m >= 60 ? (Math.round(m / 6) / 10) + (m === 60 ? ' hr / week' : ' hrs / week') : m + ' min / week'; };
      var cards = props.map(function (r) { var p = r.payload, k = key(r);
        return '<article class="pc' + (k === top ? ' win' : '') + '"><div class="votes"><b>' + (vc[k] || 0) + '</b><span>votes</span></div><div class="g">' + E(BL.groupName(r.group) || 'A group') + '</div><h3>' + E(p.title || p.problem) + '</h3>' +
          (p.title ? '<div class="sec"><span class="g">The problem</span>' + E(p.problem) + '</div>' : '') +
          '<div class="sec"><span class="g">Our fix</span>When ' + E(p.trigText).toLowerCase() + ':<ul>' + (p.actText || []).map(function (t) { return '<li>' + E(t) + '</li>'; }).join('') + '</ul>A person still owns: ' + E(p.owner) + (p.human ? ': ' + E(p.human) : '') + '</div>' +
          '<div class="sec"><span class="g">Why it matters</span>' + E(p.measText) + (p.minutes ? ' · about ' + fmt(p.minutes) + ' back' : '') + (p.instead ? ', for ' + E(p.instead) : '') + '</div>' +
          '<button class="x" data-hide="' + E(k) + '" aria-label="Hide">×</button></article>'; }).join('');
      return header('Friction to Flow', 'Which fix should Curran do first?', 'Each group’s proposal. Vote from your phone; the winner goes to Curran’s leadership.', nv) +
        '<div class="pcards">' + (cards || '<div class="empty">Proposals appear here as groups share them</div>') + '</div>';
    },
    robot: function (rows) {
      var c = {}; BL.TASKS.forEach(function (t) { c[t.id] = { human: 0, both: 0, robot: 0, n: 0 }; });
      var own = [], instead = [], mins = 0;
      rows.forEach(function (r) { var p = r.payload; for (var k in (p.sorts || {})) if (c[k]) { c[k][p.sorts[k]]++; c[k].n++; } (p.own || []).forEach(function (o) { own.push({ t: o.text, m: o.minutes, k: key(r) }); mins += o.minutes || 0; }); if (p.instead) instead.push({ t: p.instead, k: key(r) }); });
      var order = BL.TASKS.slice().sort(function (a, b) { var A = c[a.id], B = c[b.id]; return (B.n ? B.robot / B.n : 0) - (A.n ? A.robot / A.n : 0); });
      var bars = order.map(function (t) { var x = c[t.id], n = x.n || 1, seg = function (v, col, lab) { var pct = Math.round(100 * v / n); return v ? '<i style="width:' + pct + '%;background:' + col + '">' + (pct >= 12 ? pct + '% ' + lab : '') + '</i>' : ''; };
        return '<div class="rrow"><span>' + E(t.t) + '</span><div class="stack">' + seg(x.robot, '#3187B5', 'robot') + seg(x.both, '#7A8E9B', 'both') + seg(x.human, '#EA4335', 'human') + '</div></div>'; }).join('');
      var hrs = Math.round(mins / 6) / 10;
      return header('Human work vs. robot work', 'What should a system be doing for us?', 'The goal isn’t automation for its own sake. It’s more time for the work only people can do.', rows.length) +
        '<div class="grid2"><section class="panel"><div class="k">How the room sorted it</div><div class="lg"><span><i style="background:#3187B5"></i>Robot</span><span><i style="background:#7A8E9B"></i>Both</span><span><i style="background:#EA4335"></i>Human</span></div><div class="rows">' + bars + '</div></section>' +
        '<section style="display:grid;gap:16px;align-content:start"><div class="callout"><div class="k">Time the room would hand to a system</div><b style="font-size:clamp(34px,3vw,54px)">' + hrs + ' hrs / week</b><p style="margin-top:6px;color:#CFE1EC">The room’s own estimate, added up from ' + own.length + ' tasks. Not a promise, a starting point.</p></div>' +
        '<div class="panel"><div class="k">Tasks people would hand over</div><div class="items" style="max-height:30vh">' + (own.map(function (o) { return '<div class="item"><button class="x" data-hide="' + E(o.k) + '" aria-label="Hide">×</button><div class="txt">' + E(o.t) + '</div><div class="small">' + (o.m >= 60 ? Math.round(o.m / 6) / 10 + ' hr' : o.m + ' min') + ' / week</div></div>'; }).join('') || '<div class="empty" style="padding:20px">None yet</div>') + '</div></div>' +
        '<div class="panel"><div class="k">What we’d do with the time</div><div class="items" style="max-height:24vh">' + (instead.map(function (o) { return '<div class="item"><button class="x" data-hide="' + E(o.k) + '" aria-label="Hide">×</button><div class="txt">' + E(o.t) + '</div></div>'; }).join('') || '<div class="empty" style="padding:20px">None yet</div>') + '</div></div></section></div>';
    },
    moves: function (rows) {
      rows = rows.filter(function (r) { return r.payload.kind !== 'vote'; });
      var v = {}; BL.MOVES.forEach(function (m) { v[m.id] = 0; }); var other = [], ans = { know: [], auto: [], remember: [] };
      rows.forEach(function (r) { var p = r.payload; (p.votes || []).forEach(function (id) { if (id in v) v[id]++; }); if (p.other) other.push({ t: p.other, k: key(r) }); for (var q in (p.answers || {})) if (p.answers[q] && ans[q]) ans[q].push({ t: p.answers[q], k: key(r) }); });
      var ranked = BL.MOVES.slice().sort(function (a, b) { return v[b.id] - v[a.id]; }), max = Math.max(1, v[ranked[0].id]);
      var ph = function (id) { return BL.ROADMAP.filter(function (p) { return p.id === id; })[0]; };
      var bars = ranked.map(function (m, i) { var x = ph(m.p); return '<div class="mv"><span class="t">' + (i + 1) + '. ' + E(m.t) + ' <span class="w">· ' + E(x.when) + '</span></span><span class="n">' + v[m.id] + '</span><div class="bt"><i style="width:' + Math.round(100 * v[m.id] / max) + '%"></i></div></div>'; }).join('');
      var col = function (q) { return '<section class="panel"><div class="k">' + E(q.t) + '</div><div class="items" style="max-height:34vh">' + (ans[q.id].map(function (o) { return '<div class="item"><button class="x" data-hide="' + E(o.k) + '" aria-label="Hide">×</button><div class="txt">' + E(o.t) + '</div></div>'; }).join('') || '<div class="empty" style="padding:20px">None yet</div>') + '</div></section>'; };
      return header('Closing · First Moves', 'What would we change first?', 'Three dots each. The timing shows where it already sits in the plan.', rows.length) +
        '<div class="grid2"><section class="panel">' + bars + '</section><section class="panel"><div class="k">Write-ins</div><div class="items">' + (other.map(function (o) { return '<div class="item"><button class="x" data-hide="' + E(o.k) + '" aria-label="Hide">×</button><div class="txt">' + E(o.t) + '</div></div>'; }).join('') || '<div class="empty" style="padding:20px">None yet</div>') + '</div></section></div>' +
        '<div class="qcols">' + BL.QUESTIONS.map(col).join('') + '</div>';
    }
  };
  var sel = '';
  V.addEventListener('click', function (e) {
    var c = e.target.closest('[data-cell]'); if (c) { sel = sel === c.getAttribute('data-cell') ? '' : c.getAttribute('data-cell'); load(); }
    if (e.target.closest('[data-clear]')) { sel = ''; load(); }
  });
  var busy = false;
  function load() {
    if (busy) return; busy = true;
    var src = view === 'proposals' ? 'fixit' : view;
    Promise.all([BL.load(src), view === 'proposals' ? BL.load('moves') : Promise.resolve([])]).then(function (res) {
      var rows = res[0].filter(function (r) { return hidden.indexOf(key(r)) < 0 && (!grp || r.group === grp) && r.payload; });
      var y = window.scrollY; V.innerHTML = R[view](rows, sel, res[1].filter(function (r) { return r.payload; })); window.scrollTo(0, y);
    }).catch(function () { V.innerHTML = '<div class="empty">Can’t reach the results sheet. Check the connection; answers are still being saved.</div>'; })
      .then(function () { busy = false; });
  }
  setTab(['pulse', 'friction', 'fixit', 'proposals', 'robot', 'moves'].indexOf(view) > -1 ? view : 'pulse');
  if (!demo) setInterval(load, (C.refreshSeconds || 5) * 1000);
</script>
</body>
</html>
